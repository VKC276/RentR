<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>ClimbLink — Book</title>
  <link rel="stylesheet" href="css/styles.css?v=20260821b" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="media/logga.png" alt="" />
        <span class="brand-name">ClimbLink</span>
      </a>
      <div class="topbar-right">
        <nav class="nav">
          <a href="lookup.html" id="navFind">Find</a>
          <a href="/admin/" id="navAdmin">Admin</a>
        </nav>
        <div id="lang"></div>
      </div>
    </div>

    <div class="panel" id="stepDates">
      <h1 id="titleBook">Book</h1>
      <div class="cal-prompt" id="calPrompt" aria-live="polite">
        <span class="cal-prompt-step" id="calPromptStep">1</span>
        <span class="cal-prompt-text">
          <span class="cal-prompt-title" id="calPromptTitle"></span>
          <span class="cal-prompt-hint muted" id="calPromptHint"></span>
        </span>
      </div>
      <div class="cal-head">
        <button type="button" class="ghost" id="calPrev" aria-label="&#8249;">&#8249;</button>
        <div class="cal-month" id="calMonth"></div>
        <button type="button" class="ghost" id="calNext" aria-label="&#8250;">&#8250;</button>
      </div>
      <div class="cal" id="calendar"></div>
      <div class="cal-legend">
        <span><i></i><span id="legFree">Free</span></span>
        <span><i class="taken"></i><span id="legTaken">Booked</span></span>
      </div>
      <div class="date-summary" id="dateSummary" hidden>
        <div class="ds-range">
          <div class="ds-leg">
            <span class="ds-leg-label" id="dsStartLabel"></span>
            <span class="ds-leg-date" id="dsStart"></span>
          </div>
          <span class="ds-arrow" aria-hidden="true">&#8594;</span>
          <div class="ds-leg" id="dsEndLeg">
            <span class="ds-leg-label" id="dsEndLabel"></span>
            <span class="ds-leg-date" id="dsEnd"></span>
          </div>
          <div class="ds-count"><span class="badge ds-days" id="dsDays" hidden></span></div>
        </div>
        <p class="ds-note muted" id="dsNote"></p>
        <div class="ds-price" id="dsPrice" hidden></div>
        <p class="ds-actions">
          <button type="button" class="ghost" id="btnClearDates" hidden>Clear</button>
        </p>
      </div>
      <p class="err" id="errDates" hidden></p>
    </div>

    <div class="panel" id="stepPads" hidden>
      <h2 id="titlePads">Ledig utrustning</h2>
      <div class="alert" id="conflictAlert" role="alert" tabindex="-1" hidden>
        <span class="alert-icon" aria-hidden="true">!</span>
        <span class="alert-body">
          <strong class="alert-title" id="conflictTitle"></strong>
          <span class="alert-text" id="conflictText"></span>
          <span class="alert-text alert-hint" id="conflictHint"></span>
        </span>
      </div>
      <div class="pad-grid" id="padGrid"></div>
      <p style="margin-top:1rem;">
        <button type="button" id="btnContinue" disabled>Continue</button>
      </p>
      <p class="err" id="errPads" hidden></p>
    </div>

    <div class="panel" id="stepForm" hidden>
      <h2 id="titleForm">Details</h2>
      <form id="bookingForm" novalidate>
        <div class="row">
          <div><label id="lblFirst" for="firstName">First</label><input id="firstName" name="firstName" autocomplete="given-name" required /></div>
          <div><label id="lblLast" for="lastName">Last</label><input id="lastName" name="lastName" autocomplete="family-name" required /></div>
        </div>
        <div class="row">
          <div><label id="lblEmail" for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required /></div>
          <div><label id="lblPhone" for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" required /></div>
        </div>
        <div>
          <label id="lblNotes" for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="3"></textarea>
        </div>
        <div class="price-box" id="priceBox"></div>
        <p class="muted" id="payNote"></p>
        <p style="margin-top:1rem;">
          <button type="button" class="ghost" id="btnBackToPads">Back</button>
          <button type="submit" id="btnSubmit">Submit</button>
        </p>
        <p class="err" id="errForm" hidden></p>
      </form>
    </div>

    <div class="panel" id="stepThanks" hidden>
      <h2 id="thanksTitle">Thanks</h2>
      <p id="thanksText"></p>
      <p><strong id="lblBookingNo">No</strong>: <span id="bookingNumber"></span></p>
      <p><a id="manageLink" href="#">Manage</a></p>
    </div>
  </div>

  <script src="js/config.js?v=20260821b"></script>
  <script src="js/i18n.js?v=20260822a"></script>
  <script src="js/pricing.js?v=20260821b"></script>
  <script src="js/api.js?v=20260821b"></script>
  <script src="js/status.js?v=20260821b"></script>
  <script src="js/app.js?v=20260822a"></script>
</body>
</html>
