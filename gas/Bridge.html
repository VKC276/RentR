<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <title>RentR API Bridge</title>
</head>
<body>
<script>
/**
 * Runs inside GAS HtmlService (after Google's security redirect to googleusercontent.com).
 * Parent Pages app talks via postMessage; we call server with google.script.run
 * (same Google session / no CORS).
 */
(function () {
  var ALLOWED_ORIGINS = [
    'http://ledinfo.vastervikclimbing.se',
    'https://ledinfo.vastervikclimbing.se',
    'https://vkc276.github.io',
    'http://127.0.0.1',
    'http://localhost'
  ];

  function originOk(origin) {
    if (!origin || origin === 'null') return true; // sandboxed edge cases
    for (var i = 0; i < ALLOWED_ORIGINS.length; i++) {
      var allowed = ALLOWED_ORIGINS[i];
      if (origin === allowed || origin.indexOf(allowed) === 0) return true;
    }
    return false;
  }

  function reply(source, origin, msg) {
    var target = origin && origin !== 'null' ? origin : '*';
    try { source.postMessage(msg, target); } catch (e1) {
      try { source.postMessage(msg, '*'); } catch (e2) {}
    }
  }

  function announceReady() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'rentR-ready' }, '*');
      }
    } catch (e) {}
  }

  window.addEventListener('message', function (event) {
    if (!originOk(event.origin)) return;
    var data = event.data || {};

    if (data.type === 'rentR-ping') {
      reply(event.source, event.origin, { type: 'rentR-ready' });
      return;
    }

    if (data.type !== 'rentR-call' || !data.id) return;

    var action = data.action || '';
    var payload = data.payload || {};
    var sessionToken = data.sessionToken || '';

    google.script.run
      .withSuccessHandler(function (result) {
        reply(event.source, event.origin, {
          type: 'rentR-result',
          id: data.id,
          ok: true,
          result: result
        });
      })
      .withFailureHandler(function (err) {
        reply(event.source, event.origin, {
          type: 'rentR-result',
          id: data.id,
          ok: false,
          error: (err && err.message) ? err.message : String(err)
        });
      })
      .bridgeCall(action, payload, sessionToken);
  });

  announceReady();
  setTimeout(announceReady, 300);
  setTimeout(announceReady, 1000);
})();
</script>
</body>
</html>
